<g class="l" style="animation-delay:1.36s"><text class="k" x="30" y="191">Frontend</text><text class="dim" x="146" y="191">:</text><text x="160" y="191">React, Next.js, Tailwind CSS, shadcn/ui, Framer Motion</text></g>
<g class="l" style="animation-delay:1.58s"><text class="k" x="30" y="218">Backend</text><text class="dim" x="146" y="218">:</text><text x="160" y="218">Node.js, Express, REST APIs, JWT Auth, Middleware</text></g>
<g class="l" style="animation-delay:1.8s"><text class="k" x="30" y="245">Database</text><text class="dim" x="146" y="245">:</text><text x="160" y="245">MongoDB, PostgreSQL + PostGIS, Firebase, Redis</text></g>
<g class="l" style="animation-delay:2.02s"><text class="k" x="30" y="272">Mobile</text><text class="dim" x="146" y="272">:</text><text x="160" y="272">React Native, Expo, NativeWind, Reanimated</text></g>
<g class="l" style="animation-delay:2.24s"><text class="k" x="30" y="299">DSA</text><text class="dim" x="146" y="299">:</text><text x="160" y="299">C++, Trees, AVL, Recursion, LeetCode / HackerRank</text></g>
<g class="l" style="animation-delay:2.46s"><text class="k" x="30" y="326">DevOps</text><text class="dim" x="146" y="326">:</text><text x="160" y="326">Git, Docker, WSL 2, Linux, Cursor, VS Code</text></g>
<g class="l" style="animation-delay:2.68s"><text class="k" x="30" y="353">Cloud</text><text class="dim" x="146" y="353">:</text><text x="160" y="353">Vercel, Railway, Hostinger, GitHub Pages</text></g>
<g class="l" style="animation-delay:2.9s"><text class="k" x="30" y="380">Integrations</text><text class="dim" x="146" y="380">:</text><text x="160" y="380">Razorpay, Shiprocket, Cloudinary</text></g>
